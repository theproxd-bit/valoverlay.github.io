<html>
<head>
<style>
#animatedImage, #animatedImage2 {
    position: absolute;
    bottom: -500px; /* Start below screen */
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
}
#cornerImage {
    position: absolute;
    bottom: 0;
    right: 0;
}
</style>

<script src="jquery.js"></script>
<script>
function playAnimation() {
    let startOffset = "-500px";
    let centerOffset = "40%";
    let bottomOffset = "0px";
    let duration = 1000;
    let displayTime = 3000;

    $("#animatedImage").animate(
        { bottom: centerOffset, opacity: 1 },
        duration,
        function () {
            setTimeout(function () {
                $("#animatedImage").animate(
                    { bottom: startOffset, opacity: 0 },
                    duration
                );
                $("#animatedImage2").animate(
                    { bottom: bottomOffset, opacity: 1 },
                    duration,
                    function () {
                        setTimeout(function () {
                            $("#animatedImage2").animate(
                                { bottom: startOffset, opacity: 0 },
                                duration
                            );
                        }, displayTime);
                    }
                );
            }, displayTime);
        }
    );
}

$(document).ready(function () {
    // Load images.json
    $.getJSON("images.json", function(data) {
        $("#animatedImage").attr("src", data.img1);
        $("#animatedImage2 img:first").attr("src", data.img2);
        $("#cornerImage").attr("src", data.img3);

        // Apply sizes (your original)
        let imgWidth = 800;
        let imgHeight = "auto";
        let cornerBaseSize = 150;
        let cornerScale = 0.7;
        let marginX = 107;
        let marginY = 70;

        $("#animatedImage, #animatedImage2").css({
            width: imgWidth + "px",
            height: imgHeight
        });

        $("#cornerImage").css({
            width: (cornerBaseSize * cornerScale) + "px",
            height: "auto",
            right: marginX + "px",
            bottom: marginY + "px"
        });

        // Start animation AFTER images load
        playAnimation();
    });
});
</script>
</head>

<body style="background-color:black;">

<img id="animatedImage" />

<div id="animatedImage2">
    <img style="width:100%;" />
    <img id="cornerImage" />
</div>

</body>
</html>
